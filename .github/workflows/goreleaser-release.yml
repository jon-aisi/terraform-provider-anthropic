name: GoReleaser Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

jobs:
  goreleaser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # upload release assets
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation on the repository
    steps:
      # Audit rather than block: the attestation step talks to Sigstore
      # (fulcio, rekor, tuf-repo-cdn) and GitHub's attestation API, and a
      # release cannot be re-run cheaply to fix an incomplete allowlist. The
      # audit log in the step-security dashboard lists every endpoint.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # GoReleaser needs the full git history to build the changelog and detect the previous tag
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # GPG signing is optional: without GPG_PRIVATE_KEY the release is built
      # unsigned (and cannot be published to the Terraform Registry, which
      # requires the signature). The secret is only read here.
      - name: Decide whether to sign
        id: signing
        env:
          HAS_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "enabled=${HAS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        if: steps.signing.outputs.enabled == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --clean ${{ steps.signing.outputs.enabled != 'true' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # SLSA build provenance for every published artifact, verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
            dist/*.sbom.json
