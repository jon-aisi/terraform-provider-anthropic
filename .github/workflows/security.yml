name: Security

on:
  push:
    branches:
      - main
      - 'aisi/**'
  pull_request:
  merge_group:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  poutine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned by version and sha256 (value from the release's
      # poutine_<version>_checksums.txt, poutine_Linux_x86_64.tar.gz line).
      # Bump both together.
      - name: Install poutine
        env:
          POUTINE_VERSION: v1.1.3
          POUTINE_SHA256: 0f19c1402ea52a42824768bd7e4322de78b46218c6406c334c7489272ef73e8d
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/boostsecurityio/poutine/releases/download/${POUTINE_VERSION}/poutine_Linux_x86_64.tar.gz"
          echo "${POUTINE_SHA256}  poutine_Linux_x86_64.tar.gz" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/poutine"
          mkdir -p "${install_dir}"
          tar xz -C "${install_dir}" -f poutine_Linux_x86_64.tar.gz poutine
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run poutine
        run: poutine analyze_local . --config tools/.poutine.yml --fail-on-violation

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            fail-open.prod.semgrep.dev:443
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: tools/semgrep.yml

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Installed from the GitHub release with checksum verification rather than
      # through a third-party action (poutine flags setup-tflint's unverified
      # creator, and a pinned binary is the smaller supply-chain surface).
      #
      # The expected hash is pinned here, not read from the release's own
      # checksums.txt: both files come from the same source, so a compromised
      # release would poison the checksum along with the binary. Bump
      # TFLINT_VERSION and TFLINT_SHA256 together (value from the target
      # release's checksums.txt, tflint_linux_amd64.zip line).
      - name: Install tflint
        env:
          TFLINT_VERSION: v0.64.0
          TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          curl -fsSLO "${base}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint_linux_amd64.zip" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/tflint"
          mkdir -p "${install_dir}"
          unzip -o -q tflint_linux_amd64.zip -d "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/tflint" --version

      # .tflint.hcl enables the full terraform ruleset (preset "all"); the
      # bundled ruleset needs no `tflint --init`. Lints every module in the
      # repo (examples, tests), not just the files a commit touched (#229).
      - name: Run tflint
        run: tflint --recursive --format compact

  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            www.bridgecrew.cloud:443

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run checkov
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          directory: .github/workflows
          framework: github_actions
          quiet: true
          compact: true
          output_format: cli
